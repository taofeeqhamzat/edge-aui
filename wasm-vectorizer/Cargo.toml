[package]
name = "wasm-vectorizer"
version = "0.1.0"
edition = "2021"
description = "Deterministic Gate WASM module for interaction vectorization and PrefixSpan pattern mining"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[profile.release]
opt-level = "z"     # Optimize for smallest binary size (< 500KB constraint)
lto = true          # Link-Time Optimization across crates
codegen-units = 1   # Reduce parallel code generation to maximize optimization
panic = "abort"     # Remove unwinding landing pads to reduce code footprint
strip = true        # Strip symbols from binary

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

